on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # 環境変数のデバッグ用ステップ
    - name: Debug environment variables
      run: |
        echo "Firebase API Key is set to: ${FIREBASE_API_KEY}"
        echo "Firebase Auth Domain is set to: ${FIREBASE_AUTH_DOMAIN}"
        echo "Firebase Project ID is set to: ${FIREBASE_PROJECT_ID}"
        echo "Firebase Storage Bucket is set to: ${FIREBASE_STORAGE_BUCKET}"
        echo "Firebase Messaging Sender ID is set to: ${FIREBASE_MESSAGING_SENDER_ID}"
        echo "Firebase App ID is set to: ${FIREBASE_APP_ID}"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci && npm run build

    - name: Build project
      run: npm run build

    # エックスサーバーデプロイ
    - name: Deploy to XServer via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: /sinpe-pgm.com/public_html/pj/100math/
