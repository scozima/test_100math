name: Deploy to Firebase and XServer

on:
  push:
    branches:
      - main  # `main`ブランチにプッシュされたら実行

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Set up Firebase credentials
      run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > $HOME/firebase-key.json  # サービスアカウントJSONファイルとして保存
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    - name: Authenticate with Firebase using service account
      run: firebase use --add --project ${{ secrets.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_DEPLOY_TOKEN }}
      env:
        GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-key.json  # サービスアカウントのパスを指定

    - name: Build project
      run: npm run build

    # Firebase デプロイ
    - name: Deploy to Firebase
      run: firebase deploy --token ${{ secrets.FIREBASE_DEPLOY_TOKEN }}

    # エックスサーバー デプロイ
    - name: Deploy to XServer via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/  # ビルド後のフォルダ（環境によって変更）
        server-dir: /sinpe-pgm.com/public_html/pj/100math
