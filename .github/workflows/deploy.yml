name: Deploy to XServer

on:
  push:
    branches:
      - main  # `main`ブランチにプッシュされるとこのワークフローが実行される

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build  # `dist`フォルダが生成される（必要なら変更）

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/  # ビルド後のフォルダ（環境によって変更）
        server-dir: /sinpe-pgm.com/public_html/pj/100math
